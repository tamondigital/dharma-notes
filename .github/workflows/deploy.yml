name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Tell Bing (and Yandex, Seznam, Naver) about the site's URLs after each deploy.
  # The key file is public/06404ff4ad864ec6b1b48ec3226a92bb.txt; since it sits under
  # /dharma-notes/, keyLocation is required and only URLs under that path are accepted.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Submit sitemap URLs to IndexNow
        # right after deploy the key file can still 403 while Pages switches over
        run: |
          sleep 60
          python3 - <<'PY'
          import json, re, urllib.request
          base = "https://tamondigital.github.io/dharma-notes/"
          key = "06404ff4ad864ec6b1b48ec3226a92bb"
          get = lambda u: urllib.request.urlopen(u, timeout=30).read().decode()
          locs = lambda xml: re.findall(r"<loc>([^<]+)</loc>", xml)
          urls = [u for sm in locs(get(base + "sitemap-index.xml")) for u in locs(get(sm))]
          print(f"{len(urls)} URLs")
          for i in range(0, len(urls), 10000):
              body = json.dumps({"host": "tamondigital.github.io", "key": key,
                                 "keyLocation": f"{base}{key}.txt", "urlList": urls[i:i + 10000]}).encode()
              req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                           headers={"Content-Type": "application/json; charset=utf-8"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  print("IndexNow:", r.status)
          PY
